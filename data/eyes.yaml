# End Remastered の12種の目と、その要求料理。
# ソース・オブ・トゥルース（CLAUDE.md 3.4）。
#
# ============================================================
# 【中身が空である理由】
# 目のIDも料理チェーンも書いていない。理由は2つ。
#
# 1. CLAUDE.md 7章の未決定事項「12種の目に割り当てる料理チェーン」が
#    未決定。12種すべてを別系統の食材チェーンにするという条件（憲法 2.5）は
#    決まっているが、どの系統をどの目に割り当てるかは決まっていない。
#
# 2. End Remastered の目のアイテムIDを確認できていない。jar が無い。
#    CLAUDE.md 3.1 により、それらしいIDを埋めることは禁止。
# ============================================================

# 目の生成は Ars Nouveau の Enchanting Apparatus で行う（憲法 2.5）。
# レシピのシグネチャは CLAUDE.md 5.3 を参照。
ritual:
  method: "ars_nouveau:enchanting_apparatus"
  # TODO(要判断): 目1個あたりの Source 消費量。
  # Agronomic Sourcelink の供給レートと釣り合わせる必要がある。
  default_source_cost: null

# TODO(id): End Remastered の目は12種。jar の中身か /kubejs dump_registry item で
#           実際のIDを確認してから列挙する。個数が12であることも確認すること。
#
# エントリの形:
#   - key: "<内部用の識別子>"
#     item: "<目のアイテムID>"        # TODO(id) で確認したもの
#     chain: "<食材チェーンの名前>"    # 例: 養蜂、酪農、漁業 …
#     pedestals:                      # 台座アイテム 最大8（CLAUDE.md 5.3）
#       - "<アイテムID>"
#     reagent: "<中央の触媒アイテムID>"
#     source_cost: 3000
eyes: []

# 12種を別系統にするための、系統の候補置き場。
# 実際の割り当ては人間が決める。ここは議論の材料でしかない。
chain_candidates:
  - "穀物（小麦・パン系）"
  - "酪農（牛乳・チーズ系）"
  - "養蜂（蜂蜜系）"
  - "漁業（Aquaculture 2）"
  - "果樹（Croptopia の果物）"
  - "香辛料・ハーブ"
  - "根菜"
  - "畜産肉（Farmer's Delight の加工肉）"
  - "卵・鶏"
  - "発酵（漬物・酒）"
  - "菓子（砂糖・カカオ）"
  - "きのこ"
