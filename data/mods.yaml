# 【未記入の理由】
# mod_id と version は空のままにしてある。CLAUDE.md 3.1 により、mod ID を
# 記憶や推測で書いてはいけない。このリポジトリには jar が無く（4章の方針どおり
# jar はコミットしない）、確認手段が現時点で存在しないため。
#
# 埋め方:
#   1. 各 mod の jar を手元に置く
#   2. unzip -p <jar> META-INF/mods.toml で modId を読む
